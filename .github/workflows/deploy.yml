name: CI/CD Pipeline

on:
  push:
    branches:
      - main   # master-na master nu maathiko bro

jobs:
  # -------------------------------------------------------------
  # Job 1: Build Application First
  # -------------------------------------------------------------
  build:
    name: 🏗️ 1. Build Test
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v3

      - name: Setup Node.js
        uses: actions/setup-node@v3
        with:
          node-version: '18'

      - name: Build Frontend
        run: |
          cd frontend
          npm ci
          npm run build --if-present

  # -------------------------------------------------------------
  # Job 2: Lint & Syntax Check (Runs after Build)
  # -------------------------------------------------------------
  lint-and-check:
    name: 🔍 2. Lint & Syntax Check
    needs: build   # Build pass aana thaan lint run aagum
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v3

      - name: Setup Node.js
        uses: actions/setup-node@v3
        with:
          node-version: '18'

      - name: Install Frontend Dependencies
        run: |
          cd frontend
          npm ci

      - name: Run Frontend Lint
        run: |
          cd frontend
          npm run lint --if-present

  # -------------------------------------------------------------
  # Job 3: Deploy to EC2 Server (Runs after Lint)
  # -------------------------------------------------------------
  deploy:
    name: 🚀 3. Deploy to EC2
    needs: lint-and-check   # Lint-um pass aana dhaan EC2-la deploy aagum
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v3

      - name: Deploy via SSH to EC2
        uses: appleboy/ssh-action@v0.1.6
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USERNAME }}
          key: ${{ secrets.EC2_SSH_KEY }}
          script: |
            cd /home/ubuntu/AWS-Practice
            git pull origin main
            docker compose down
            docker compose up -d --build